name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"
      
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      
      - name: Generate
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          BASE_URL: /${{ github.event.repository.name }}/
          NODE_ENV: production
        run: yarn generate
      
      - name: List generated files
        run: |
          echo "=== Contents of .output/public ==="
          ls -la .output/public || echo "Directory not found"
          echo ""
          echo "=== Looking for index.html ==="
          find .output/public -name "index.html" -type f || echo "index.html not found"
          echo ""
          echo "=== Directory structure ==="
          tree .output/public -L 3 || find .output/public -type f | head -20
      
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .output/public
          keep_files: false
          force_orphan: true
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"

